name: Agentic Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同分支新推送取消进行中的旧运行，节省额度且结果总是最新提交的。
  group: agentic-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = 代码语法下限（PEP 604 联合类型），3.13 = 开发者日常版本；
        # 中间版本抽样，验证引擎与测试在通用 Python 环境下可运行。
        python: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        # sox：执行合成 WAV、陷波衰减与语音频段保真测试；
        # RNNoise 集成测试另需 ffmpeg 和模型，缺失时如实 skip。
        # packaging：test_qwen_setup 用它从 requirements 动态推导版本基线
        # （setup-python 的独立 CPython 不自带该包）。
        run: |
          sudo apt-get update && sudo apt-get install -y sox
          python -m pip install --disable-pip-version-check packaging
      - name: Run release gate
        run: python tools/validate.py release
